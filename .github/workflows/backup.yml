name: Sauvegarde quotidienne

on:
  schedule:
    # Tous les jours à 02:00 UTC (~03h/04h heure de Paris)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la sauvegarde Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/backup" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${BACKUP_TOKEN}\"}")
          echo "HTTP $code"
          cat /tmp/out.txt
          if [ "$code" -ge 400 ]; then
            echo "Sauvegarde échouée"
            exit 1
          fi
          echo "Sauvegarde déclenchée."
