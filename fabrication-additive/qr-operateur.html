<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR — Accès opérateur Impression 3D</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --primary:#7c3aed; --primary-dark:#5b21b6; --text:#1f2233; --muted:#6b7280; --bg:#f4f1fb; --border:#e2dcf1; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 30px rgba(60,20,90,.10);max-width:460px;width:100%;padding:30px 30px 26px;text-align:center}
  .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
  h1{font-size:1.5rem;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
  .sub{font-size:.92rem;color:var(--muted);margin-bottom:20px;line-height:1.5}
  .qr-frame{display:inline-block;padding:16px;background:#fff;border:2px solid var(--primary);border-radius:14px}
  #qrcode{width:280px;height:280px}
  #qrcode img,#qrcode canvas{width:280px !important;height:280px !important;display:block}
  .url{margin-top:16px;font-size:.8rem;color:var(--muted);word-break:break-all;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .hint{margin-top:16px;font-size:.9rem;color:var(--text);line-height:1.5}
  .hint b{color:var(--primary-dark)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:9px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.ghost{background:var(--bg);color:var(--primary-dark);border:1px solid var(--primary)}
  .btn:hover{filter:brightness(1.05)}
  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;border:none;max-width:none}
    .actions,.url{display:none}
    .qr-frame{border-color:#000}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Impression 3D · Atelier GMP</div>
    <h1>Accès opérateur</h1>
    <div class="sub">Scannez ce QR code avec votre téléphone pour ouvrir directement l'espace opérateur.</div>
    <div class="qr-frame"><div id="qrcode"></div></div>
    <div class="url" id="urlText"></div>
    <div class="hint">Le QR ouvre l'appli et propose la saisie de votre <b>code opérateur</b>. L'espace reste protégé.</div>
    <div class="actions">
      <button class="btn primary" onclick="window.print()">🖨️ Imprimer</button>
      <button class="btn ghost" id="dlBtn">⬇ Télécharger le PNG</button>
    </div>
  </div>
<script>
  // URL cible : l'appli impression 3D avec ouverture directe de l'espace opérateur.
  var TARGET = 'https://gmpbordeaux.fr/gmp-projet-atelier/fabrication-additive/?vue=operateur';
  document.getElementById('urlText').textContent = TARGET;
  var qr = new QRCode(document.getElementById('qrcode'), {
    text: TARGET, width: 560, height: 560,
    colorDark:'#000000', colorLight:'#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  // Téléchargement PNG (à partir du canvas généré par la librairie).
  document.getElementById('dlBtn').addEventListener('click', function(){
    var cvs = document.querySelector('#qrcode canvas');
    var url = cvs ? cvs.toDataURL('image/png') : (document.querySelector('#qrcode img')||{}).src;
    if(!url) return;
    var a = document.createElement('a');
    a.href = url; a.download = 'qr-acces-operateur-impression3d.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>
